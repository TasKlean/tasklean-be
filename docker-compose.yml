version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tasklean-db
    environment:
      POSTGRES_DB: tasklean_dev
      POSTGRES_USER: ${DB_USERNAME:-dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tasklean_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.32
    container_name: tasklean-mail
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      # Ring buffer, so a container left running for weeks never fills the disk.
      MP_MAX_MESSAGES: 500
      # Accept any credentials over a plain connection, so one Spring config shape works
      # against both Mailpit and a hosted sandbox - dev needs no settings of its own.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local S3 for image uploads.
  localstack:
    image: localstack/localstack:4.9.2
    container_name: tasklean-s3
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET:-tasklean-dev}
      # Off by default, which would accept an upload whose size or type differs from signature
      S3_SKIP_SIGNATURE_VALIDATION: 0
    ports:
      - "4566:4566"
    volumes:
      # Creates the bucket and applies the CORS rules on every start
      - ./docker/localstack:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket ${S3_BUCKET:-tasklean-dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  localstack_data: