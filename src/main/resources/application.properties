# Load .env file from project root
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=tasklean-api
server.port=8080

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT - 15 min access, 14 day refresh
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=1209600000

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# Actuator - expose only the public health endpoint, no internal details (includes DB connectivity check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Logging - silence Spring MVC's "Resolved [exception]" WARN for every handled exception.
# It's redundant with RequestLoggingFilter's summary line and mislabels expected 4xx (e.g. 404) as WARN.
# Genuine 500s still log a full stack trace via GlobalExceptionHandler's catch-all.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
