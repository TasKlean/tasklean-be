# Load .env file from project root
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=tasklean-api
server.port=8080

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT - 15 min access, 14 day refresh.
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=1209600000

# Server - behind Render's proxy: makes getRemoteAddr() the immediate caller (Cloudflare's edge)
# rather than Render's internal load balancer. That is ClientIpResolver's last-resort rung, not the
# end user - see ClientIpResolver. Harmless in dev (no proxy).
server.forward-headers-strategy=native

# BFF hop secret(s) - proves a request came from our own frontend, so the X-Device-Ip it forwards can
# be trusted as the end user's. Comma-separated to allow rotation: add the new value here, switch the
# frontend, then drop the old one. No default, so staging/prod cannot start without it; generate with:
# openssl rand -base64 32
bff.hop-secrets=${BFF_HOP_SECRETS}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Frontend base URL - the single canonical origin used to build links in emails
# (e.g. the verify-email link). Distinct from the cors.allowed-origins list.
app.base-url=${APP_BASE_URL}

# Two-factor secret encryption (AES-256-GCM, Base64 of 32 bytes). No default here, so a non-dev
# profile fails to start without it; generate one with: openssl rand -base64 32
twofactor.encryption-key=${TWO_FACTOR_ENC_KEY}

# Rate limiting - token-bucket tiers under ratelimit.* (see RateLimitProperties); override per env.
# Defaults: auth 10/min, register 5/hour, refresh 20/min, api 120/min per user + 300/min per IP,
# join 10/hour per user (invite-code redemption).

# OpenAPI / Swagger UI - spec at /v3/api-docs, UI at /swagger-ui.html (see OpenApiConfig).
# /error is an infrastructure dispatch target (ApiErrorController), not part of the API surface.
springdoc.paths-to-exclude=/error

# Sorted keys + pretty printing keep the exported docs/openapi.json diffable: without them, key
# order can shift between runs and every export looks like a change.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID}

# Mail - which provider sends is pure env config (a hosted sandbox for staging, Mailpit locally),
# so swapping one for another never touches code. No defaults here: a non-dev profile must be told.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
# Secure by default. The dev profile turns both off for the local catcher, which speaks plain SMTP.
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
# JavaMail waits forever by default, so a provider that accepts the connection and then stalls would
# hold request threads until the container killed them.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender on every outgoing message. A sandbox accepts any address; a real-delivery provider only
# accepts a verified one, which is why this is overridable rather than a constant in the code.
app.mail.from=${MAIL_FROM:noreply@tasklean.app}

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB

# Actuator - expose only the public health endpoint, no internal details (includes DB connectivity check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Logging - silence Spring MVC's "Resolved [exception]" WARN for every handled exception.
# It's redundant with RequestLoggingFilter's summary line and mislabels expected 4xx (e.g. 404) as WARN.
# Genuine 500s still log a full stack trace via GlobalExceptionHandler's catch-all.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
