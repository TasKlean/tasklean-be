# Database - Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tasklean_dev
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Show SQL in dev
spring.jpa.show-sql=true

# Flyway
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
google.redirect-uri=http://localhost:3000/auth/google/callback

# Mail (Mailtrap)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_USERNAME}
spring.mail.password=${MAILTRAP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.tasklean=DEBUG
logging.level.org.hibernate.SQL=DEBUG