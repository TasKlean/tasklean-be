# Database - Docker PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/tasklean_dev
spring.datasource.username=${DB_USERNAME:dev}
spring.datasource.password=${DB_PASSWORD:devpass}

# Show SQL in dev
spring.jpa.show-sql=true

# Flyway
spring.flyway.clean-disabled=false

# JWT
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-min-256-bits!!}
jwt.expiration=86400000

# Google OAuth
google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
google.redirect-uri=http://localhost:3000/auth/google/callback

# Logging
logging.level.com.tasklean=DEBUG
logging.level.org.hibernate.SQL=DEBUG