# Show SQL in dev
spring.jpa.show-sql=true

# Flyway
spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Frontend base URL for email links - local default so dev needs no APP_BASE_URL.
# Base config has no default, so staging/prod must set APP_BASE_URL explicitly.
app.base-url=${APP_BASE_URL:http://localhost:3000}

# CORS allowed origins - local default so dev needs no CORS_ALLOWED_ORIGINS.
# Base config has no default, so staging/prod must set CORS_ALLOWED_ORIGINS explicitly.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT - long-lived access token for local testing (1 year). Dev only; prod keeps the 15 min from base config.
# Overridable to exercise token refresh/rotation locally.
jwt.expiration=${JWT_EXPIRATION:31536000000}

# Logging
logging.level.com.tasklean=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# OpenApiSpecExporter writes the generated spec here on every startup, so the committed contract
# tracks the code. Relative to the working directory; dev profile only.
tasklean.openapi.export-path=docs/openapi.json
