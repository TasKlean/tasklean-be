# Flyway
spring.flyway.clean-disabled=true

# Google OAuth
google.redirect-uri=${GOOGLE_REDIRECT_URI}

# Logging
logging.level.com.tasklean=INFO

# Structured logging: emit ECS (Elastic Common Schema) JSON to stdout so a log drain
# (Kibana/Grafana-Loki/Datadog) can ingest it without parsing. MDC keys (requestId, userId)
# become top-level fields. Dev keeps the human-readable console.
logging.structured.format.console=ecs